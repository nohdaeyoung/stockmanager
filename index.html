<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Prestige Stock Portfolio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg:        #0A0C0F;
      --card:      #12151A;
      --card-hover:#1A1E26;
      --border:    #1E2329;
      --text:      #E8E8E8;
      --muted:     #6B7280;
      --gold:      #C9A84C;
      --gold-dim:  rgba(201,168,76,.15);
      --up:        #26A69A;
      --up-dim:    rgba(38,166,154,.12);
      --dn:        #EF5350;
      --dn-dim:    rgba(239,83,80,.12);
      --font:      'Inter', sans-serif;
      --mono:      'JetBrains Mono', 'Inter', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── 헤더 ── */
    .site-header {
      padding: 20px 24px 0;
      display: flex; align-items: center; gap: 10px;
    }
    .site-header h1 {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em;
      display: flex; align-items: center;
    }
    .site-header h1 i { color: var(--gold); margin-right: 8px; }
    .site-header .badge {
      font-size: .7rem; padding: 2px 8px; border-radius: 20px;
      background: var(--gold-dim); color: var(--gold); font-weight: 600;
    }

    /* ── KPI 카드 ── */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      padding: 16px 24px;
    }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi-card .label { font-size: .72rem; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
    .kpi-card .value { font-family: var(--mono); font-size: 1.4rem; font-weight: 700; }
    .kpi-card .value.up { color: var(--up); }
    .kpi-card .value.dn { color: var(--dn); }
    .kpi-card .value.gold { color: var(--gold); }

    /* ── 탭바 ── */
    .tabbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .tabs { display: flex; gap: 0; }
    .tab {
      padding: 14px 20px; font-size: .9rem; font-weight: 600;
      color: var(--muted); background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    
    .tab-right { display: flex; align-items: center; gap: 12px; }
    .last-update { font-size: .75rem; color: var(--muted); }
    .refresh-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      cursor: pointer; color: var(--muted); font-size: 1rem;
      transition: background .15s, color .15s;
    }
    .refresh-btn:hover { background: var(--card-hover); color: var(--gold); }
    .refresh-btn.spinning i { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 패널 ── */
    .panel { display: none; animation: fadeIn .2s ease-out; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ── PC 테이블 ── */
    .table-wrap { overflow-x: auto; padding: 24px; }
    table {
      border-collapse: collapse; width: 100%; min-width: 900px;
      background: var(--card); border-radius: 12px; overflow: hidden;
      font-size: .85rem;
    }
    thead { position: sticky; top: 53px; z-index: 10; }
    th {
      background: #0E1117; color: var(--muted);
      padding: 12px 16px; text-align: right;
      font-size: .75rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    th:first-child { text-align: left; }
    td {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      text-align: right; white-space: nowrap;
      font-family: var(--mono); font-size: .9rem;
      transition: background .1s;
    }
    td:first-child { font-family: var(--font); text-align: left; font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    tbody tr { border-left: 3px solid transparent; transition: background .12s, border-color .12s; }
    tbody tr:hover { background: var(--card-hover); }
    
    tbody tr.up-row { border-left-color: var(--up); }
    tbody tr.dn-row { border-left-color: var(--dn); }
    tbody tr.flat-row { border-left-color: var(--gold); }
    
    .up { color: var(--up); } 
    .dn { color: var(--dn); } 
    .na { color: var(--muted); }
    
    .symbol-link { color: var(--text); text-decoration: none; transition: color .12s; font-weight: 600; }
    .symbol-link:hover { color: var(--gold); }
    .symbol-code { display: block; font-size: 0.75rem; color: var(--muted); font-family: var(--mono); margin-top: 2px; font-weight: 400; }

    /* ── 모바일 카드 ── */
    .mobile-list { display: none; padding: 16px 16px 80px; }
    .stock-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; overflow: hidden; cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .stock-card.expanded {
      border-color: rgba(201,168,76,.35);
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    .stock-card.up-card { border-left: 3px solid var(--up); }
    .stock-card.dn-card { border-left: 3px solid var(--dn); }
    .stock-card.flat-card { border-left: 3px solid var(--gold); }
    
    .card-header {
      padding: 16px;
      display: flex; align-items: center; justify-content: space-between;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .card-header:active { background: var(--card-hover); }
    .card-left .name { font-size: 1rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .card-left .code { font-size: .8rem; color: var(--muted); font-family: var(--mono); }
    .card-right { text-align: right; }
    .card-price { font-family: var(--mono); font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .card-change { font-size: .85rem; font-weight: 500; font-family: var(--mono); }
    
    .card-chevron {
      color: var(--muted); font-size: .9rem; margin-left: 12px;
      transition: transform .25s; flex-shrink: 0;
    }
    .stock-card.expanded .card-chevron { transform: rotate(180deg); }
    
    .card-body {
      max-height: 0; overflow: hidden;
      transition: max-height .3s ease-out, opacity .25s; opacity: 0;
    }
    .stock-card.expanded .card-body { max-height: 250px; opacity: 1; }
    
    .card-details {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .card-detail-item { display: flex; flex-direction: column; }
    .card-detail-item .dl { font-size: .75rem; color: var(--muted); margin-bottom: 4px; letter-spacing: .02em; text-transform: uppercase; }
    .card-detail-item .dv { font-family: var(--mono); font-size: .95rem; font-weight: 500; color: var(--text); }

    /* ── 모바일 FAB ── */
    .fab {
      display: none; position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 20px;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--gold); color: #000; font-size: 1.2rem;
      border: none; cursor: pointer; z-index: 200;
      box-shadow: 0 4px 16px rgba(201,168,76,.4);
      align-items: center; justify-content: center;
      transition: transform .12s, box-shadow .12s;
    }
    .fab:active { transform: scale(.93); }
    .fab.spinning i { animation: spin .8s linear infinite; }

    /* ── 로딩 상태 ── */
    .loading-msg { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }
    .error-msg { text-align: center; padding: 40px; color: var(--dn); font-size: 0.9rem; }

    /* ── 반응형 ── */
    @media(max-width: 1023px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 767px) {
      .site-header { padding: 16px 16px 0; }
      .kpi-grid { padding: 16px; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .kpi-card { padding: 12px 14px; }
      .kpi-card .value { font-size: 1.2rem; }
      .tabbar { padding: 0 16px; }
      .tab { padding: 14px 16px; font-size: .9rem; }
      .last-update { display: none; }
      .table-wrap { display: none; }
      .mobile-list { display: block; }
      .fab { display: flex; }
    }
  </style>
</head>
<body>

<!-- 헤더 -->
<header class="site-header">
  <h1><i class="fas fa-layer-group"></i> Prestige</h1>
  <span class="badge">Portfolio</span>
</header>

<!-- KPI -->
<div class="kpi-grid">
  <div class="kpi-card">
    <div class="label">Total Assets</div>
    <div class="value gold" id="kpi-total">—</div>
  </div>
  <div class="kpi-card">
    <div class="label">Gainers</div>
    <div class="value up" id="kpi-up">—</div>
  </div>
  <div class="kpi-card">
    <div class="label">Losers</div>
    <div class="value dn" id="kpi-dn">—</div>
  </div>
  <div class="kpi-card">
    <div class="label">Unchanged</div>
    <div class="value" id="kpi-flat" style="color:var(--muted)">—</div>
  </div>
</div>

<!-- 탭바 -->
<div class="tabbar">
  <div class="tabs">
    <button class="tab active" data-tab="kr">🇰🇷 Korea Stocks</button>
    <button class="tab" data-tab="us">🇺🇸 US Stocks</button>
  </div>
  <div class="tab-right">
    <span class="last-update" id="last-update"></span>
    <button class="refresh-btn" id="refresh-btn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
  </div>
</div>

<!-- 한국 패널 -->
<div class="panel active" id="panel-kr">
  <!-- PC 테이블 -->
  <div class="table-wrap">
    <table id="tbl-kr">
      <thead><tr>
        <th>Security</th><th>Last Price</th><th>Change</th><th>% Change</th>
        <th>High</th><th>Low</th><th>Prev. Close</th>
      </tr></thead>
      <tbody id="kr-tbody"><tr><td colspan="7" class="loading-msg">Loading market data...</td></tr></tbody>
    </table>
  </div>
  
  <!-- 모바일 카드 -->
  <div class="mobile-list" id="kr-cards"></div>
</div>

<!-- 미국 패널 -->
<div class="panel" id="panel-us">
  <!-- PC 테이블 -->
  <div class="table-wrap">
    <table id="tbl-us">
      <thead><tr>
        <th>Security</th><th>Last Price</th><th>Change</th><th>% Change</th>
        <th>High</th><th>Low</th><th>Prev. Close</th>
      </tr></thead>
      <tbody id="us-tbody"><tr><td colspan="7" class="loading-msg">Loading market data...</td></tr></tbody>
    </table>
  </div>
  
  <!-- 모바일 카드 -->
  <div class="mobile-list" id="us-cards"></div>
</div>

<!-- 모바일 FAB -->
<button class="fab" id="fab" title="Refresh"><i class="fas fa-sync-alt"></i></button>

<script>
let currentKRData = [];
let currentUSData = [];
let currentTab = 'kr';

// ── 탭 전환 ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  
  // Update KPI based on active tab
  updateKPI(tab === 'kr' ? currentKRData : currentUSData);
}
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => { switchTab(btn.dataset.tab); }));

// ── 갱신 버튼 ──
function setSpinning(on) {
  document.getElementById('refresh-btn').classList.toggle('spinning', on);
  document.getElementById('fab').classList.toggle('spinning', on);
}
document.getElementById('refresh-btn').addEventListener('click', loadAllData);
document.getElementById('fab').addEventListener('click', loadAllData);

// ── KPI 업데이트 ──
function updateKPI(quotes) {
  const valid = quotes.filter(q => q.price != null);
  const up = valid.filter(q => (q.change || 0) > 0).length;
  const dn = valid.filter(q => (q.change || 0) < 0).length;
  const flat = valid.length - up - dn;
  
  // Tab Name logic
  const tabName = currentTab === 'kr' ? 'Total Assets (KR)' : 'Total Assets (US)';
  document.querySelector('.kpi-grid .kpi-card:nth-child(1) .label').textContent = tabName;
  
  document.getElementById('kpi-total').textContent = valid.length;
  document.getElementById('kpi-up').textContent = up;
  document.getElementById('kpi-dn').textContent = dn;
  document.getElementById('kpi-flat').textContent = flat;
}

// ── 포맷 헬퍼 ──
function fmtNum(v, isUSD=false) {
  if (v == null || v === '' || v === 'N/A' || isNaN(v)) return '<span class="na">—</span>';
  return isUSD ? Number(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : Number(v).toLocaleString('ko-KR');
}
function fmtChange(ch, isUSD=false) {
  if (ch == null || isNaN(ch)) return '<span class="na">—</span>';
  const sign = ch > 0 ? '▲' : ch < 0 ? '▼' : '';
  const cls  = ch > 0 ? 'up' : ch < 0 ? 'dn' : '';
  const val  = isUSD ? Math.abs(Number(ch)).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : Math.abs(Number(ch)).toLocaleString('ko-KR');
  return `<span class="${cls}">${sign} ${isUSD ? '$' : ''}${val}</span>`;
}
function fmtPct(pct) {
  if (pct == null || isNaN(pct)) return '<span class="na">—</span>';
  const n = parseFloat(pct);
  const cls = n > 0 ? 'up' : n < 0 ? 'dn' : '';
  const sign = n > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
}
function naverLink(code) { return `https://finance.naver.com/item/main.naver?code=${code}`; }
function yahooLink(code) { return `https://finance.yahoo.com/quote/${code}`; }

// ── 모바일 카드 토글 ──
window.toggleCard = function(el) {
  el.classList.toggle('expanded');
}

// ── 한국 데이터 렌더 ──
function renderKR(data) {
  currentKRData = data;
  if(currentTab === 'kr') updateKPI(data);

  // 데스크톱 테이블 렌더링
  const tbody = document.getElementById('kr-tbody');
  tbody.innerHTML = data.map(q => {
    const ch = q.change || 0;
    const rowCls = ch > 0 ? 'up-row' : ch < 0 ? 'dn-row' : 'flat-row';
    return `<tr class="${rowCls}">
      <td>
        <a class="symbol-link" href="${naverLink(q.code)}" target="_blank" rel="noopener">${q.name}</a>
        <span class="symbol-code">${q.code}</span>
      </td>
      <td>${fmtNum(q.price)}</td>
      <td>${fmtChange(ch)}</td>
      <td>${fmtPct(q.rate)}</td>
      <td class="up">${fmtNum(q.high)}</td>
      <td class="dn">${fmtNum(q.low)}</td>
      <td style="color:var(--muted);">${fmtNum(q.prev)}</td>
    </tr>`;
  }).join('');

  // 모바일 카드 렌더링
  const cards = document.getElementById('kr-cards');
  cards.innerHTML = data.map((q, i) => {
    const ch = q.change || 0;
    const cardCls = ch > 0 ? 'up-card' : ch < 0 ? 'dn-card' : 'flat-card';
    return `<div class="stock-card ${cardCls}">
      <div class="card-header" onclick="toggleCard(this.parentElement)">
        <div class="card-left">
          <div class="name">${q.name}</div>
          <div class="code">${q.code}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="card-right">
            <div class="card-price">${fmtNum(q.price)}</div>
            <div class="card-change">${fmtChange(ch)} ${fmtPct(q.rate)}</div>
          </div>
          <span class="card-chevron"><i class="fas fa-chevron-down"></i></span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-details">
          <div class="card-detail-item"><div class="dl">Prev. Close</div><div class="dv">${fmtNum(q.prev)}</div></div>
          <div class="card-detail-item"><div class="dl">Open</div><div class="dv">${fmtNum(q.open)}</div></div>
          <div class="card-detail-item"><div class="dl">High</div><div class="dv up">${fmtNum(q.high)}</div></div>
          <div class="card-detail-item"><div class="dl">Low</div><div class="dv dn">${fmtNum(q.low)}</div></div>
        </div>
        <div style="padding: 0 16px 16px;">
          <a href="${naverLink(q.code)}" target="_blank" rel="noopener" style="display:block; text-align:center; padding:10px; background:var(--card-hover); border-radius:8px; color:var(--text); text-decoration:none; font-size:0.85rem; font-weight:600; border:1px solid var(--border); transition:background 0.2s;">
            View on Naver Finance <i class="fas fa-external-link-alt" style="margin-left:4px; font-size:0.8em; color:var(--muted);"></i>
          </a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── 미국 데이터 렌더 ──
function renderUS(data) {
  currentUSData = data;
  if(currentTab === 'us') updateKPI(data);

  // 데스크톱 테이블 렌더링
  const tbody = document.getElementById('us-tbody');
  tbody.innerHTML = data.map(q => {
    const ch = q.change || 0;
    const rowCls = ch > 0 ? 'up-row' : ch < 0 ? 'dn-row' : 'flat-row';
    return `<tr class="${rowCls}">
      <td>
        <a class="symbol-link" href="${yahooLink(q.code)}" target="_blank" rel="noopener">${q.name}</a>
        <span class="symbol-code">${q.code}</span>
      </td>
      <td>$${fmtNum(q.price, true)}</td>
      <td>${fmtChange(ch, true)}</td>
      <td>${fmtPct(q.rate)}</td>
      <td class="up">$${fmtNum(q.high, true)}</td>
      <td class="dn">$${fmtNum(q.low, true)}</td>
      <td style="color:var(--muted);">$${fmtNum(q.prev, true)}</td>
    </tr>`;
  }).join('');

  // 모바일 카드 렌더링
  const cards = document.getElementById('us-cards');
  cards.innerHTML = data.map((q, i) => {
    const ch = q.change || 0;
    const cardCls = ch > 0 ? 'up-card' : ch < 0 ? 'dn-card' : 'flat-card';
    return `<div class="stock-card ${cardCls}">
      <div class="card-header" onclick="toggleCard(this.parentElement)">
        <div class="card-left">
          <div class="name">${q.name}</div>
          <div class="code">${q.code}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="card-right">
            <div class="card-price">$${fmtNum(q.price, true)}</div>
            <div class="card-change">${fmtChange(ch, true)} ${fmtPct(q.rate)}</div>
          </div>
          <span class="card-chevron"><i class="fas fa-chevron-down"></i></span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-details">
          <div class="card-detail-item"><div class="dl">Prev. Close</div><div class="dv">$${fmtNum(q.prev, true)}</div></div>
          <div class="card-detail-item"><div class="dl">Open</div><div class="dv">—</div></div>
          <div class="card-detail-item"><div class="dl">High</div><div class="dv up">$${fmtNum(q.high, true)}</div></div>
          <div class="card-detail-item"><div class="dl">Low</div><div class="dv dn">$${fmtNum(q.low, true)}</div></div>
        </div>
        <div style="padding: 0 16px 16px;">
          <a href="${yahooLink(q.code)}" target="_blank" rel="noopener" style="display:block; text-align:center; padding:10px; background:var(--card-hover); border-radius:8px; color:var(--text); text-decoration:none; font-size:0.85rem; font-weight:600; border:1px solid var(--border); transition:background 0.2s;">
            View on Yahoo Finance <i class="fas fa-external-link-alt" style="margin-left:4px; font-size:0.8em; color:var(--muted);"></i>
          </a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── 데이터 로드 ──
async function loadAllData() {
  setSpinning(true);
  try {
    const krRes = fetch('data/latest_kr_prices.json?t=' + Date.now()).then(r => r.json());
    const usRes = fetch('data/latest_us_prices.json?t=' + Date.now()).then(r => r.json());
    
    const [krData, usData] = await Promise.all([
        krRes.catch(e => { console.error("KR data error", e); return []; }),
        usRes.catch(e => { console.error("US data error", e); return []; })
    ]);
    
    if (krData.length > 0) renderKR(krData);
    else document.getElementById('kr-tbody').innerHTML = `<tr><td colspan="7" class="error-msg"><i class="fas fa-exclamation-triangle"></i> Failed to load KR data</td></tr>`;
    
    if (usData.length > 0) renderUS(usData);
    else document.getElementById('us-tbody').innerHTML = `<tr><td colspan="7" class="error-msg"><i class="fas fa-exclamation-triangle"></i> Failed to load US data</td></tr>`;

    const now = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('last-update').textContent = 'Last updated ' + now;

  } catch (e) {
    console.error("Load all error", e);
  }
  setSpinning(false);
}

// 초기 로드
loadAllData();
setInterval(loadAllData, 60000); // 1분마다 갱신 시도
</script>
</body>
</html>
