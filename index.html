<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestige Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --sidebar-bg: #1a202c; --sidebar-text: #a0aec0; --active: #3182ce; --bg: #f7fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin:0; background:var(--bg); color:#2d3748; display:flex; height:100vh; overflow:hidden; }
        .sidebar { width:260px; background:var(--sidebar-bg); color:var(--sidebar-text); display:flex; flex-direction:column; flex-shrink:0; }
        .logo { height:60px; display:flex; align-items:center; padding:0 1.5rem; font-weight:bold; color:white; font-size:1.2rem; border-bottom:1px solid #2d3748; }
        .menu { flex:1; overflow-y:auto; padding:1rem 0; }
        .menu-group { border-bottom: 1px solid #2d3748; }
        .menu-header { padding: 0.8rem 1.5rem; font-size: 0.85rem; font-weight: 600; color: #cbd5e0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .menu-header:hover { background: #2d3748; color: white; }
        .menu-header i { font-size: 0.8rem; transition: transform 0.2s; }
        .menu-header.collapsed i { transform: rotate(-90deg); }
        .menu-items-container { display: block; overflow: hidden; }
        .menu-items-container.hidden { display: none; }
        .menu-item { padding:0.75rem 1.5rem 0.75rem 2rem; cursor:pointer; display:flex; align-items:center; transition:0.2s; font-size: 0.9rem; border-left: 3px solid transparent; }
        .menu-item:hover { background:#2d3748; color:white; }
        .menu-item.active { background:#2a4365; color:white; border-left-color: var(--active); }
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .header { height:60px; background:white; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; flex-shrink:0; }
        .content-scroll { flex:1; overflow-y:auto; padding:2rem; }
        .widget-box { background:white; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:2rem; overflow:hidden; display:flex; flex-direction:column; min-height: 420px; }
        .widget-tabs { display: flex; background: #fcfcfc; border-bottom: 1px solid #e2e8f0; }
        .widget-tab { padding: 1rem 1.5rem; cursor: pointer; font-weight: 600; color: #718096; border-right: 1px solid #e2e8f0; border-bottom: 2px solid transparent; transition: 0.2s; }
        .widget-tab:hover { background: #f7fafc; color: #2d3748; }
        .widget-tab.active { background: white; color: #3182ce; border-bottom-color: #3182ce; }
        .widget-content { padding: 0; flex: 1; display: none; }
        .widget-content.active { display: block; }
        .kr-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
        .kr-table th { background:#f7fafc; padding:0.8rem 1rem; text-align:right; font-weight:600; color:#718096; border-bottom:1px solid #e2e8f0; position:sticky; top:0; }
        .kr-table th:first-child { text-align:left; }
        .kr-table td { padding:0.8rem 1rem; border-bottom:1px solid #edf2f7; text-align:right; }
        .kr-table td:first-child { text-align:left; font-weight:500; color:#2d3748; }
        .kr-table-container { overflow-y:auto; max-height:360px; }
        .change-up { color:#48bb78; font-weight:600; }
        .change-down { color:#f56565; font-weight:600; }
        .report-view { background:white; border-radius:8px; border:1px solid #e2e8f0; padding:3rem; max-width:900px; margin:0 auto; }
        .loading { text-align:center; padding:2rem; color:#718096; }
        .markdown-body { line-height:1.7; }
        .markdown-body h1 { border-bottom:1px solid #e2e8f0; }
        .markdown-body table { width:100%; border-collapse:collapse; margin:1rem 0; }
        .markdown-body th, .markdown-body td { border:1px solid #e2e8f0; padding:0.6rem 1rem; }
        .markdown-body th { background:#f7fafc; }
        .markdown-body a { color: #3182ce; }
        @media (max-width:768px) { body{flex-direction:column; overflow:auto;} .sidebar{width:100%; height:auto;} .content-scroll{overflow:visible;} }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo"><i class="fas fa-chart-line" style="margin-right:10px; color:#3182ce;"></i> PRESTIGE</div>
    <div class="menu" id="report-menu">Loading...</div>
</div>
<div class="main">
    <header class="header">
        <div style="font-weight:600; font-size:1.1rem;" id="page-title">Dashboard</div>
        <div style="font-size:0.9rem; color:#718096;" id="current-time"></div>
    </header>
    <div class="content-scroll">
        <div class="widget-box">
            <div class="widget-tabs">
                <div class="widget-tab active" onclick="switchTab('us')">🇺🇸 US Stocks</div>
                <div class="widget-tab" onclick="switchTab('kr')">🇰🇷 Korea Stocks</div>
            </div>
            <div id="tab-us" class="widget-content active">
                <div class="tradingview-widget-container">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
                  {
                  "width": "100%", "height": 360,
                  "symbolsGroups": [ { "name": "US Stocks", "symbols": [
                        { "name": "NASDAQ:AAPL", "displayName": "Apple" }, { "name": "NYSE:DIS", "displayName": "Disney" }, { "name": "NYSE:F", "displayName": "Ford" }, { "name": "NYSE:NKE", "displayName": "Nike" },
                        { "name": "NASDAQ:NVDA", "displayName": "NVIDIA" }, { "name": "NASDAQ:TSLA", "displayName": "Tesla" }, { "name": "AMEX:VOO", "displayName": "Vanguard S&P 500" },
                        { "name": "NASDAQ:GOOGL", "displayName": "Google" }, { "name": "NASDAQ:AMZN", "displayName": "Amazon" }, { "name": "NASDAQ:PLTR", "displayName": "Palantir" },
                        { "name": "NASDAQ:AVGO", "displayName": "Broadcom" }, { "name": "AMEX:CONY", "displayName": "Cony" }, { "name": "NYSE:ETN", "displayName": "Eaton" }
                  ] } ],
                  "showSymbolLogo": true, "isTransparent": false, "colorTheme": "light", "locale": "en"
                }
                  </script>
                </div>
            </div>
            <div id="tab-kr" class="widget-content">
                <div class="kr-table-container">
                    <table class="kr-table" id="kr-stock-list">
                        <thead><tr><th>Company</th><th>Price</th><th>Chg</th><th>%</th><th>High</th><th>Low</th><th>Prev</th></tr></thead>
                        <tbody><tr><td colspan="7" style="text-align:center; padding:2rem;">Loading data...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="report-container" class="report-view">
            <div class="loading">Select a report to view details.</div>
        </div>
    </div>
</div>
<script>
    window.onerror = function(msg) { document.getElementById('report-menu').innerHTML = 'Error: ' + msg; };

    setInterval(() => document.getElementById('current-time').innerText = new Date().toLocaleString(), 1000);

    function switchTab(tab) {
        document.querySelectorAll('.widget-tab').forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.widget-content').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
    }

    async function init() {
        const menu = document.getElementById('report-menu');
        try {
            const res = await fetch('index.md?t=' + Date.now());
            if (!res.ok) throw new Error('Index load failed: ' + res.status);
            const text = await res.text();
            
            const reports = [];
            text.split('\n').forEach(line => {
                const m = line.match(/- \[(.*?)\]\((.*?)\)/);
                if (m) {
                    let title = m[1]; let url = m[2];
                    if (url.includes('/blob/gh-pages/')) url = url.split('/blob/gh-pages/')[1];
                    let date = "Unknown";
                    // Fixed Regex for Python string: \\d
                    let dateMatch = title.match(/(\d{4}-\d{2}-\d{2})/);
                    if (!dateMatch) dateMatch = url.match(/(\d{4}-\d{2}-\d{2})/);
                    if (dateMatch) date = dateMatch[1];
                    reports.push({ title, url, date });
                }
            });

            // Start JSON fetch
            loadKoreaData();

            const groups = {};
            reports.forEach(r => {
                const month = (r.date !== "Unknown") ? r.date.substring(0, 7) : "Recent";
                if (!groups[month]) groups[month] = [];
                groups[month].push(r);
            });

            menu.innerHTML = '';
            const sortedMonths = Object.keys(groups).sort().reverse();
            sortedMonths.forEach((month, groupIdx) => {
                const grpDiv = document.createElement('div'); grpDiv.className = 'menu-group';
                const header = document.createElement('div'); header.className = 'menu-header';
                header.innerHTML = `<span>${month}</span> <i class="fas fa-chevron-down"></i>`;
                const itemsContainer = document.createElement('div'); itemsContainer.className = 'menu-items-container';
                if (groupIdx > 0) { itemsContainer.classList.add('hidden'); header.classList.add('collapsed'); }
                header.onclick = () => { itemsContainer.classList.toggle('hidden'); header.classList.toggle('collapsed'); };
                groups[month].forEach((r) => {
                    const item = document.createElement('div'); item.className = 'menu-item';
                    let cleanTitle = r.title.replace(' Report', '');
                    item.innerHTML = `<i class="fas fa-file-alt" style="margin-right:10px; width:15px; text-align:center;"></i> ${cleanTitle}`;
                    item.onclick = () => {
                        document.querySelectorAll('.menu-item').forEach(e => e.classList.remove('active'));
                        item.classList.add('active');
                        loadReport(r.url, r.title);
                    };
                    itemsContainer.appendChild(item);
                });
                grpDiv.appendChild(header); grpDiv.appendChild(itemsContainer); menu.appendChild(grpDiv);
            });
            if (menu.querySelector('.menu-item')) menu.querySelector('.menu-item').click();
        } catch (e) { 
            menu.innerHTML = '<p style="padding:1rem; color:red">Error: ' + e.message + '</p>';
        }
    }

    async function loadKoreaData() {
        try {
            const res = await fetch('data/latest_kr_prices.json?t=' + Date.now());
            if (!res.ok) throw new Error('Data file not found');
            const data = await res.json();
            const tbody = document.querySelector('#kr-stock-list tbody');
            tbody.innerHTML = '';
            data.forEach(item => {
                const code = item.code; const name = item.name;
                const price = item.price.toLocaleString();
                const high = item.high.toLocaleString(); const low = item.low.toLocaleString();
                const prev = item.prev.toLocaleString();
                const chgVal = item.change; const rate = item.rate.toFixed(2);
                let colorClass = ''; let sign = '';
                if (chgVal > 0) { colorClass = 'change-up'; sign = '+'; } else if (chgVal < 0) { colorClass = 'change-down'; sign = ''; }
                const chgStr = sign + chgVal.toLocaleString(); const pctStr = sign + rate + '%';
                const tr = document.createElement('tr');
                const linkUrl = `https://finance.naver.com/item/main.naver?code=${code}`;
                const nameHtml = `<a href="${linkUrl}" target="_blank" style="font-weight:600; color:#2b6cb0; text-decoration:none;">${name} <i class="fas fa-external-link-alt" style="font-size:0.7em; opacity:0.5;"></i></a>`;
                tr.innerHTML = `<td>${nameHtml}</td><td>${price}</td><td class="${colorClass}">${chgStr}</td><td class="${colorClass}">${pctStr}</td><td>${high}</td><td>${low}</td><td>${prev}</td>`;
                tbody.appendChild(tr);
            });
        } catch (e) {
            document.querySelector('#kr-stock-list tbody').innerHTML = `<tr><td colspan="7" style="color:red">Data load failed: ${e.message}</td></tr>`;
        }
    }

    async function loadReport(url, title) {
        document.getElementById('page-title').innerText = title;
        const container = document.getElementById('report-container');
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
        try {
            const res = await fetch(url + '?t=' + Date.now());
            if (!res.ok) throw new Error('Load failed');
            const md = await res.text();
            container.innerHTML = marked.parse(md);
        } catch (e) { container.innerHTML = `<p style="color:red">Error: ${e.message}</p>`; }
    }
    
    init();
</script>
</body>
</html>
